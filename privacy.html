<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policy — Army NCO Prep</title>
<!-- The policy moved to the extensionless /privacy-policy, which is the URL that goes into
     App Store Connect. GitHub Pages serves static files only and cannot issue a real 301, so
     this is the closest equivalent: a canonical link for crawlers, a meta refresh, and a
     scripted replace. The visible link is the fallback if all three are blocked — this page
     must never dead-end, because Apple may still hold the old URL on file. -->
<link rel="canonical" href="https://jordanbesse.github.io/army-board-study-guide/privacy-policy">
<meta http-equiv="refresh" content="0; url=./privacy-policy">
<script>location.replace("./privacy-policy");</script>
<style>
  :root{ --bg:#f4f6f4; --surface:#fff; --ink:#151a15; --muted:#5a635b; --line:#dfe4df; --accent:#4f7350; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11150f; --surface:#191e18; --ink:#e6ebe4; --muted:#9aa598; --line:#2c332a; --accent:#88ab8b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:40px 20px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px}
  h1{font-size:22px;margin:0 0 10px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>This page has moved</h1>
    <p>The Army NCO Prep privacy policy now lives at
      <a href="./privacy-policy">/privacy-policy</a>.</p>
  </div>
</div>
</body>
</html>
